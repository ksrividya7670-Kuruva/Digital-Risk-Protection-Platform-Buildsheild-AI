services:
  - type: web
    name: brandshield-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./brandshield.db
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: https://buildsheild-ai.vercel.app
